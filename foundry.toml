[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
cache_path = "cache"
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200

[profile.ci]
optimizer = true
optimizer_runs = 10000

[fmt]
line_length = 120
tab_width = 4
use_tabs = false
bracket_spacing = true
int_types = "long"
